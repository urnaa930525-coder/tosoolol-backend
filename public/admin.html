<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>NextKino — Админ Upload</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; background: #10191C; color: #F2ECE0; padding: 0 20px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 14px; font-size: 0.85rem; color: #9DAEAF; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 20px; background: #E3A24B; color: #1a130a; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #result { margin-top: 20px; padding: 12px; border-radius: 8px; background: #1a2a26; font-size: 0.85rem; white-space: pre-wrap; }
  #list { margin-top: 30px; }
  .vid { padding: 10px; background: #17242a; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
  .vid button { margin: 0; padding: 4px 10px; background: #C9604C; font-size: 0.75rem; }
</style>
</head>
<body>
  <h1>NextKino — Видео Upload (Admin)</h1>
  <form id="uploadForm">
    <label>Нэр (title)</label>
    <input type="text" name="title" required>
    <label>Ангилал (category)</label>
    <select name="category">
      <option value="ai">AI кино</option>
      <option value="movie">Кино</option>
      <option value="series">Цуврал</option>
      <option value="show">Нэвтрүүлэг</option>
    </select>
    <label>Тайлбар (description)</label>
    <textarea name="description" rows="3"></textarea>
    <label>Badge (жишээ: 6:20, 1ц 42м, 5-р анги)</label>
    <input type="text" name="badge">
    <label>Видео файл (mp4, webm, mov, mkv)</label>
    <input type="file" name="video" accept="video/*" required>
    <label>Хадмал файл (.srt эсвэл .vtt) — заавал биш</label>
    <input type="file" name="subtitle" accept=".srt,.vtt">
    <label>Хадмалын хэл</label>
    <select name="subtitleLang">
      <option value="mn">Монгол</option>
      <option value="en">Англи</option>
    </select>
    <button type="submit">Upload хийх</button>
  </form>
  <div id="result"></div>
  <div id="list"></div>

  <h3 style="margin-top:40px;">Дансаар шилжүүлсэн хүсэлтүүд</h3>
  <div id="manualRequests"></div>

<script>
const form = document.getElementById('uploadForm');
const result = document.getElementById('result');
const listEl = document.getElementById('list');
const manualEl = document.getElementById('manualRequests');

async function loadManualRequests() {
  const res = await fetch('/api/admin/manual-requests');
  const reqs = await res.json();
  manualEl.innerHTML = reqs.slice().reverse().map(r => `
    <div class="vid">
      <span>${r.userId.slice(0,8)}… — ${r.amount}₮ — ${r.status} — ${new Date(r.createdAt).toLocaleString()}</span>
      ${r.status === 'pending' ? `<span>
        <button onclick="approveReq(${r.id})">Батлах</button>
        <button onclick="rejectReq(${r.id})" style="background:#555;">Цуцлах</button>
      </span>` : ''}
    </div>`).join('') || '<p style="color:#9DAEAF;">Хүсэлт алга.</p>';
}
async function approveReq(id) {
  await fetch(`/api/admin/manual-requests/${id}/approve`, { method: 'POST' });
  loadManualRequests();
}
async function rejectReq(id) {
  await fetch(`/api/admin/manual-requests/${id}/reject`, { method: 'POST' });
  loadManualRequests();
}
window.approveReq = approveReq;
window.rejectReq = rejectReq;

async function loadVideos() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  listEl.innerHTML = '<h3>Байршуулсан видеонууд (' + videos.length + ')</h3>' +
    videos.map(v => `
      <div class="vid-block">
        <div class="vid">
          <span>${v.title} — ${v.category} (${(v.size/1024/1024).toFixed(1)} MB)${v.subtitleUrl ? ' · 📝 ' + (v.subtitleLang||'').toUpperCase() : ''}</span>
          <span>
            <button onclick="togglePreview(${v.id})" style="background:#4B3F92;">Урьдчилан үзэх</button>
            <button onclick="delVideo(${v.id})">Устгах</button>
          </span>
        </div>
        <div id="preview-${v.id}" style="display:none; margin:8px 0 16px;"></div>
      </div>`).join('');
  window._videos = videos;
}

function togglePreview(id) {
  const box = document.getElementById('preview-' + id);
  if (box.style.display === 'block') { box.style.display = 'none'; box.innerHTML = ''; return; }
  const v = window._videos.find(x => x.id === id);

  const video = document.createElement('video');
  video.src = v.url;
  video.controls = true;
  video.style.maxWidth = '100%';
  video.style.maxHeight = '400px';
  video.style.background = '#000';

  if (v.subtitleUrl) {
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.src = v.subtitleUrl;
    track.srclang = v.subtitleLang || 'mn';
    track.label = v.subtitleLang === 'en' ? 'English' : 'Монгол';
    track.default = true;
    video.appendChild(track);
    video.addEventListener('loadedmetadata', () => {
      if (video.textTracks && video.textTracks[0]) video.textTracks[0].mode = 'showing';
    });
  }

  box.innerHTML = '';
  box.appendChild(video);
  box.style.display = 'block';
}
window.togglePreview = togglePreview;

async function delVideo(id) {
  await fetch('/api/videos/' + id, { method: 'DELETE' });
  loadVideos();
}
window.delVideo = delVideo;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  result.textContent = 'Uploading...';
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: new FormData(form) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Алдаа');
    result.textContent = 'Амжилттай! ID: ' + data.id + '\nURL: ' + data.url;
    form.reset();
    loadVideos();
  } catch (err) {
    result.textContent = 'Алдаа: ' + err.message;
  }
});

loadVideos();
loadManualRequests();
</script>
</body>
</html>
