<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>NextKino — Админ Upload</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; background: #10191C; color: #F2ECE0; padding: 0 20px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 14px; font-size: 0.85rem; color: #9DAEAF; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 20px; background: #E3A24B; color: #1a130a; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #result { margin-top: 20px; padding: 12px; border-radius: 8px; background: #1a2a26; font-size: 0.85rem; white-space: pre-wrap; }
  #list { margin-top: 30px; }
  .vid { padding: 10px; background: #17242a; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .vid-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .vid-thumb { width: 56px; height: 84px; object-fit: cover; border-radius: 4px; background: #0c1416; flex-shrink: 0; }
  .vid button { margin: 0; padding: 4px 10px; background: #C9604C; font-size: 0.75rem; }
  video::cue {
    font-size: clamp(12px, 1.2vw, 18px);
    background: rgba(0,0,0,0.6);
    line-height: 1.3;
  }
</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<body>
  <h1>NextKino — Видео Upload (Admin)</h1>
  <div style="background:#1a2a26; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:0.85rem;">
    <label style="margin-top:0;">Admin токен</label>
    <div style="display:flex; gap:8px;">
      <input type="password" id="adminTokenInput" placeholder="ADMIN_TOKEN-ээ оруулна уу" style="margin-top:4px;">
      <button type="button" id="saveTokenBtn" style="margin-top:4px; white-space:nowrap;">Хадгалах</button>
    </div>
  </div>
  <form id="uploadForm">
    <label>Нэр (title)</label>
    <input type="text" name="title" required>
    <label>Ангилал (category)</label>
    <select name="category">
      <option value="ai">AI кино</option>
      <option value="movie">Кино</option>
      <option value="series">Цуврал</option>
      <option value="show">Нэвтрүүлэг</option>
    </select>
    <label>Тайлбар (description)</label>
    <textarea name="description" rows="3"></textarea>
    <label>Badge (жишээ: 6:20, 1ц 42м, 5-р анги)</label>
    <input type="text" name="badge">
    <label>Видео файл (mp4, webm, mov, mkv)</label>
    <input type="file" name="video" accept="video/*" required>
    <label>Thumbnail зураг (jpg/png/webp) — заавал биш, өгөхгүй бол видеоноос автоматаар авна</label>
    <input type="file" name="thumbnail" accept="image/jpeg,image/png,image/webp">
    <label>Хадмал файл (.srt эсвэл .vtt) — заавал биш</label>
    <input type="file" name="subtitle" accept=".srt,.vtt">
    <label>Хадмалын хэл</label>
    <select name="subtitleLang">
      <option value="mn">Монгол</option>
      <option value="en">Англи</option>
    </select>
    <button type="submit">Upload хийх</button>
  </form>
  <div id="result"></div>
  <div id="uploadProgressWrap" style="display:none; margin-top:10px;">
    <div style="background:#1a1a1a; border-radius:6px; overflow:hidden; height:10px;">
      <div id="uploadProgressBar" style="background:#E3A24B; height:100%; width:0%; transition:width .2s;"></div>
    </div>
    <div id="uploadProgressText" style="font-size:0.8rem; color:#9DAEAF; margin-top:4px;"></div>
  </div>
  <div id="list"></div>

  <h3 style="margin-top:40px;">Дансаар шилжүүлсэн хүсэлтүүд</h3>
  <div id="manualRequests"></div>

<script>
const form = document.getElementById('uploadForm');
const result = document.getElementById('result');
const listEl = document.getElementById('list');
const manualEl = document.getElementById('manualRequests');
const adminTokenInput = document.getElementById('adminTokenInput');
const saveTokenBtn = document.getElementById('saveTokenBtn');

adminTokenInput.value = localStorage.getItem('nk_admin_token') || '';
saveTokenBtn.addEventListener('click', () => {
  localStorage.setItem('nk_admin_token', adminTokenInput.value.trim());
  result.textContent = 'Токен хадгалагдлаа.';
  loadVideos();
  loadManualRequests();
});

function adminFetch(url, opts = {}) {
  const headers = Object.assign({}, opts.headers, { 'x-admin-token': localStorage.getItem('nk_admin_token') || '' });
  return fetch(url, Object.assign({}, opts, { headers }));
}

async function loadManualRequests() {
  const res = await adminFetch('/api/admin/manual-requests');
  if (res.status === 401) { manualEl.innerHTML = '<p style="color:#C9604C;">Admin токен буруу эсвэл хоосон байна.</p>'; return; }
  const reqs = await res.json();
  manualEl.innerHTML = reqs.slice().reverse().map(r => `
    <div class="vid">
      <span>${r.userId.slice(0,8)}… — ${r.amount}₮ (${r.planId || '1m'}) — ${r.status} — ${new Date(r.createdAt).toLocaleString()}</span>
      ${r.status === 'pending' ? `<span>
        <button onclick="approveReq(${r.id})">Батлах</button>
        <button onclick="rejectReq(${r.id})" style="background:#555;">Цуцлах</button>
      </span>` : ''}
    </div>`).join('') || '<p style="color:#9DAEAF;">Хүсэлт алга.</p>';
}
async function approveReq(id) {
  await adminFetch(`/api/admin/manual-requests/${id}/approve`, { method: 'POST' });
  loadManualRequests();
}
async function rejectReq(id) {
  await adminFetch(`/api/admin/manual-requests/${id}/reject`, { method: 'POST' });
  loadManualRequests();
}
window.approveReq = approveReq;
window.rejectReq = rejectReq;

async function loadVideos() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  listEl.innerHTML = '<h3>Байршуулсан видеонууд (' + videos.length + ')</h3>' +
    videos.map(v => `
      <div class="vid-block">
        <div class="vid">
          <span class="vid-info">
            ${v.thumbnailUrl ? `<img class="vid-thumb" src="${v.thumbnailUrl}" alt="">` : ''}
            <span>${v.title} — ${v.category} (${(v.size/1024/1024).toFixed(1)} MB)${v.subtitleUrl ? ' · 📝 ' + (v.subtitleLang||'').toUpperCase() : ''}</span>
          </span>
          <span>
            <button onclick="togglePreview(${v.id})" style="background:#4B3F92;">Урьдчилан үзэх</button>
            <button onclick="pickThumbnail(${v.id})" style="background:#2E7D6B;">Thumbnail солих</button>
            <button onclick="delVideo(${v.id})">Устгах</button>
          </span>
        </div>
        <div id="preview-${v.id}" style="display:none; margin:8px 0 16px;"></div>
      </div>`).join('');
  window._videos = videos;
}

function togglePreview(id) {
  const box = document.getElementById('preview-' + id);
  if (box.style.display === 'block') { box.style.display = 'none'; box.innerHTML = ''; return; }
  const v = window._videos.find(x => x.id === id);

  const video = document.createElement('video');
  if (v.thumbnailUrl) video.poster = v.thumbnailUrl;
  video.controls = true;
  video.style.maxWidth = '100%';
  video.style.maxHeight = '400px';
  video.style.background = '#000';

  const isHls = /\.m3u8($|\?)/.test(v.url);
  if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = v.url;
  } else if (isHls && window.Hls && window.Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(v.url);
    hls.attachMedia(video);
  } else {
    video.src = v.url;
  }

  if (v.subtitleUrl) {
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.src = v.subtitleUrl;
    track.srclang = v.subtitleLang || 'mn';
    track.label = v.subtitleLang === 'en' ? 'English' : 'Монгол';
    track.default = true;
    video.appendChild(track);
    video.addEventListener('loadedmetadata', () => {
      if (video.textTracks && video.textTracks[0]) video.textTracks[0].mode = 'showing';
    });
  }

  box.innerHTML = '';
  box.appendChild(video);
  box.style.display = 'block';
}
window.togglePreview = togglePreview;

function pickThumbnail(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/jpeg,image/png,image/webp';
  input.onchange = async () => {
    if (!input.files[0]) return;
    const fd = new FormData();
    fd.append('thumbnail', input.files[0]);
    result.textContent = 'Thumbnail шинэчилж байна...';
    try {
      const res = await adminFetch(`/api/videos/${id}/thumbnail`, { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Алдаа');
      result.textContent = 'Thumbnail шинэчлэгдлээ.';
      loadVideos();
    } catch (err) {
      result.textContent = 'Алдаа: ' + err.message;
    }
  };
  input.click();
}
window.pickThumbnail = pickThumbnail;

async function delVideo(id) {
  await adminFetch('/api/videos/' + id, { method: 'DELETE' });
  loadVideos();
}
window.delVideo = delVideo;

const progressWrap = document.getElementById('uploadProgressWrap');
const progressBar = document.getElementById('uploadProgressBar');
const progressText = document.getElementById('uploadProgressText');

function fmtMB(bytes){ return (bytes/1024/1024).toFixed(1) + ' MB'; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const videoFile = form.querySelector('input[name="video"]').files[0];
  if (!videoFile) { result.textContent = 'Видео файл сонгоно уу.'; return; }

  const title = form.querySelector('input[name="title"]').value;
  const category = form.querySelector('select[name="category"]').value;
  const description = form.querySelector('textarea[name="description"]').value;
  const badge = form.querySelector('input[name="badge"]').value;
  const subtitleLang = form.querySelector('select[name="subtitleLang"]').value;
  const thumbnailFile = form.querySelector('input[name="thumbnail"]').files[0];
  const subtitleFile = form.querySelector('input[name="subtitle"]').files[0];

  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  result.textContent = 'Bunny-д видео бэлдэж байна...';

  try {
    // Step 1: ask our server to create the Bunny video entry + get a
    // signed token for a direct browser -> Bunny upload.
    const initRes = await adminFetch('/api/upload/init', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    const init = await initRes.json();
    if (!initRes.ok) throw new Error(init.error || 'Эхлүүлэхэд алдаа гарлаа');

    // Step 2: upload the video file straight to Bunny — this never touches
    // our Render server, so file size/timeouts on our side don't matter.
    await new Promise((resolve, reject) => {
      const upload = new tus.Upload(videoFile, {
        endpoint: init.tusEndpoint,
        retryDelays: [0, 3000, 5000, 10000, 20000],
        headers: {
          AuthorizationSignature: init.signature,
          AuthorizationExpire: String(init.expire),
          VideoId: init.videoId,
          LibraryId: String(init.libraryId)
        },
        metadata: { filetype: videoFile.type, title },
        onError: reject,
        onProgress: (uploaded, total) => {
          const pct = Math.round((uploaded / total) * 100);
          progressBar.style.width = pct + '%';
          progressText.textContent = `${pct}% — ${fmtMB(uploaded)} / ${fmtMB(total)}`;
        },
        onSuccess: resolve
      });
      upload.start();
    });

    // Step 3: video bytes are on Bunny now — save the metadata + optional
    // thumbnail/subtitle (small files, fine to send through our server).
    result.textContent = 'Дуусгаж байна...';
    const fd = new FormData();
    fd.append('title', title);
    fd.append('category', category);
    fd.append('description', description);
    fd.append('badge', badge);
    fd.append('subtitleLang', subtitleLang);
    fd.append('bunnyVideoId', init.videoId);
    fd.append('size', String(videoFile.size));
    if (thumbnailFile) fd.append('thumbnail', thumbnailFile);
    if (subtitleFile) fd.append('subtitle', subtitleFile);

    const finalRes = await adminFetch('/api/upload/finalize', { method: 'POST', body: fd });
    const data = await finalRes.json();
    if (!finalRes.ok) throw new Error(data.error || 'Алдаа');

    result.textContent = 'Амжилттай! ID: ' + data.id + '\nURL: ' + data.url;
    form.reset();
    progressWrap.style.display = 'none';
    loadVideos();
  } catch (err) {
    result.textContent = 'Алдаа: ' + err.message;
    progressWrap.style.display = 'none';
  }
});

loadVideos();
loadManualRequests();
</script>
</body>
</html>
